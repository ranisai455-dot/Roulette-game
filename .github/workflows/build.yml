name: Build WebView APK

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Download Official WebView Template
        run: |
          git clone https://github.com/empoCode/HtmlViewerAndroid.git project-workspace
          cp index.html project-workspace/app/src/main/assets/index.html

      - name: Grant Execute Permission for Gradle
        run: |
          cd project-workspace
          chmod +x gradlew

      - name: Build Debug APK
        run: |
          cd project-workspace
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v3
        with:
          name: roulette-game-apk
          path: project-workspace/app/build/outputs/apk/debug/app-debug.apk
