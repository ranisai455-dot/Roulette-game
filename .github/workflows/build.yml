name: Build WebView APK

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Clone Official WebView Template and Inject HTML
        run: |
          git clone https://github.com/empoCode/HtmlViewerAndroid.git android-ws
          cp index.html android-ws/app/src/main/assets/index.html

      - name: Build APK
        run: |
          cd android-ws
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: roulette-apk
          path: android-ws/app/build/outputs/apk/debug/app-debug.apk
